[package]
name = "four-in-a-row"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Four in a Row: drop discs, line up four, for the terminal. Rust + Ratatui"

[[bin]]
name = "four-in-a-row"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
